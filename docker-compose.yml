version: '3.9'

services:
  # ──────────────────────────────────────────────────
  #  NestJS Application
  # ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: pos-backend
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      # Override Redis to use the local container instead of the cloud instance
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ''
      REDIS_URI: redis://redis:6379
    volumes:
      # Hot-reload: mount source code (exclude node_modules)
      - .:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pos-network

  # ──────────────────────────────────────────────────
  #  Redis Cache
  # ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pos-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pos-network

# ──────────────────────────────────────────────────
#  Volumes & Networks
# ──────────────────────────────────────────────────
volumes:
  redis-data:
    driver: local

networks:
  pos-network:
    driver: bridge
